<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TubePro Player</title>
    <link rel="stylesheet" href="player.css" />
  </head>
  <body>
    <main id="player" tabindex="0" aria-label="TubePro video player">
      <video id="video" playsinline preload="auto"></video>
      <header class="top">
        <div class="brand">
          <span class="logo" data-icon="play"></span>Tube<span>Pro</span>
        </div>
        <button
          id="original"
          class="subtle"
          title="Restore the original YouTube player"
        >
          <span>YouTube player</span><span data-icon="external"></span>
        </button>
      </header>
      <div id="loading" role="status">
        <div class="orb" data-icon="play"></div>
        <h1>Settle in. Press play.</h1>
        <p id="loading-text">Connecting to your video…</p>
        <small>YouTube is always available if playback fails.</small>
      </div>
      <button
        id="center-play"
        aria-label="Play video"
        data-icon="play"
        hidden
      ></button>
      <div id="toast" role="status" hidden>
        <span id="toast-text"></span><button id="undo" hidden>Undo</button>
      </div>
      <section class="bottom" aria-label="Playback controls">
        <div class="video-heading">
          <h2 id="title">Your next great watch</h2>
          <span id="stream-badge" class="stream-badge">Connecting</span>
        </div>
        <div class="timeline">
          <div id="markers" aria-hidden="true"></div>
          <input
            id="seek"
            type="range"
            min="0"
            max="100"
            step="0.1"
            value="0"
            aria-label="Seek video"
          />
        </div>
        <div class="controls">
          <div class="controls-left">
            <button
              id="play"
              aria-label="Play"
              title="Play / Pause (K)"
              data-icon="play"
            ></button>
            <button
              id="back"
              aria-label="Back 10 seconds"
              title="Back 10 seconds (J)"
              data-icon="back"
            ></button>
            <button
              id="forward"
              aria-label="Forward 10 seconds"
              title="Forward 10 seconds (L)"
              data-icon="forward"
            ></button>
            <div class="volume-group">
              <button
                id="mute"
                aria-label="Mute"
                title="Mute (M)"
                data-icon="volume"
              ></button
              ><input
                id="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
                aria-label="Volume"
              />
            </div>
            <span id="time">0:00 <span>/</span> 0:00</span>
          </div>
          <div class="controls-right">
            <button
              id="sponsor"
              class="chip"
              aria-label="SponsorBlock"
              aria-pressed="true"
              title="Toggle SponsorBlock for this video"
            >
              <span data-icon="shield"></span
              ><span class="chip-text">SponsorBlock</span>
            </button>
            <label class="select-label"
              ><select id="speed" aria-label="Playback speed">
                <option value="0.5">0.5×</option>
                <option value="0.75">0.75×</option>
                <option value="1" selected>1×</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="1.75">1.75×</option>
                <option value="2">2×</option>
              </select></label
            >
            <label class="select-label"
              ><select id="quality" aria-label="Video quality">
                <option value="auto">Auto</option>
              </select></label
            >
            <button
              id="pip"
              aria-label="Picture in picture"
              title="Picture in picture"
              data-icon="pip"
            ></button
            ><button
              id="fullscreen"
              aria-label="Fullscreen"
              title="Fullscreen (F)"
              data-icon="fullscreen"
            ></button>
          </div>
        </div>
      </section>
    </main>
    <script src="player.js"></script>
  </body>
</html>
